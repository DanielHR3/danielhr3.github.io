<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#000}
.card{position:relative;width:1200px;height:630px;background:#000;color:#f4f4f4;font-family:'Barlow',sans-serif;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:-20%;z-index:-2;background:radial-gradient(ellipse 55% 70% at 78% 55%, rgba(128,160,42,.85) 0%, rgba(72,94,20,.5) 30%, rgba(0,0,0,0) 64%)}
.grid{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse 60% 70% at 40% 50%,#000 10%,transparent 75%)}
.dust{position:absolute;inset:0;z-index:-1;background-image:
 radial-gradient(2px 2px at 12% 20%, rgba(201,239,74,.9) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 33% 72%, rgba(255,255,255,.7) 50%, transparent 51%),
 radial-gradient(2.5px 2.5px at 48% 36%, rgba(201,239,74,.6) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 61% 88%, rgba(255,255,255,.6) 50%, transparent 51%),
 radial-gradient(2px 2px at 74% 14%, rgba(201,239,74,.7) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 86% 58%, rgba(255,255,255,.55) 50%, transparent 51%),
 radial-gradient(2.5px 2.5px at 92% 30%, rgba(201,239,74,.5) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 22% 50%, rgba(255,255,255,.5) 50%, transparent 51%),
 radial-gradient(2px 2px at 40% 8%, rgba(201,239,74,.5) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 8% 82%, rgba(255,255,255,.6) 50%, transparent 51%);
 background-size:600px 600px}
.brand{position:absolute;top:44px;left:64px;font-family:'Barlow Condensed';font-weight:800;font-size:30px;letter-spacing:.08em}
.brand span{color:#c9ef4a}
.url{position:absolute;top:46px;right:64px;font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:#b9b9b9}
.chip{position:absolute;left:64px;top:190px;font-family:'Barlow Condensed';font-weight:700;font-size:24px;letter-spacing:.05em;text-transform:uppercase;background:#c9ef4a;color:#000;padding:9px 14px 7px;line-height:1}
h1{position:absolute;left:64px;top:250px;font-family:'Barlow Condensed';font-weight:800;font-size:96px;line-height:.9;text-transform:uppercase;text-shadow:0 10px 40px rgba(0,0,0,.8)}
.role{position:absolute;left:64px;top:455px;font-family:'Barlow Condensed';font-weight:700;font-size:34px;letter-spacing:.08em;text-transform:uppercase;color:#c9ef4a}
.facts{position:absolute;left:64px;top:515px;font-size:22px;color:#b9b9b9;font-weight:500}
.photo{position:absolute;right:72px;top:165px;width:300px;height:300px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.18);box-shadow:0 0 0 16px rgba(0,0,0,.6),0 40px 100px rgba(0,0,0,.85)}
.photo img{width:100%;height:100%;object-fit:cover}
</style></head><body><div class="card">
<div class="grid"></div><div class="dust"></div>
<div class="brand">DHR<span>.</span></div>
<div class="url">danielhr3.github.io</div>
<div class="chip">Disponible para proyectos</div>
<h1>Daniel<br>Hernández Rubio</h1>
<div class="role">Ingeniero de Software Fullstack</div>
<div class="facts">Next.js · NestJS · Angular · Go · Python · PostgreSQL / PostGIS</div>
<div class="photo"><img src="profile.jpg" alt=""></div>
</div></body></html>
